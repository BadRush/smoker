map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve upstream HTTPS/TLS scheme from Cloudflared Tunnel, Caddy, or external Nginx proxy
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Preserve real client IP (Cloudflare CF-Connecting-IP -> X-Real-IP -> $remote_addr)
map $http_x_real_ip $upstream_real_ip {
    default $http_x_real_ip;
    ''      $remote_addr;
}

map $http_cf_connecting_ip $forwarded_real_ip {
    default $http_cf_connecting_ip;
    ''      $upstream_real_ip;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Re-resolve Docker service IPs dynamically so container recreates never leave stale 502 upstreams
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 16m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /ws/ {
        set $central_upstream http://central:8080;
        proxy_pass $central_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        set $central_upstream http://central:8080;
        proxy_pass $central_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /healthz {
        set $central_upstream http://central:8080;
        proxy_pass $central_upstream;
    }

    location = /readyz {
        set $central_upstream http://central:8080;
        proxy_pass $central_upstream;
    }

    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
