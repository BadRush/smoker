map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Re-resolve Docker service IPs dynamically so container recreates never leave stale 502 upstreams
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /ws/ {
        set $central_upstream http://central:8080;
        proxy_pass $central_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        # Optional NOC TV IP allowlist if exposed outside LAN:
        # location /api/tv/ {
        #     allow 10.0.0.0/8;
        #     allow 172.16.0.0/12;
        #     allow 192.168.0.0/16;
        #     allow 127.0.0.1;
        #     deny all;
        #     set $central_upstream http://central:8080;
        #     proxy_pass $central_upstream;
        # }
        set $central_upstream http://central:8080;
        proxy_pass $central_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        set $central_upstream http://central:8080;
        proxy_pass $central_upstream;
    }

    location = /readyz {
        set $central_upstream http://central:8080;
        proxy_pass $central_upstream;
    }

    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
