services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: smoker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smoker}
      POSTGRES_USER: ${POSTGRES_USER:-smoker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smoker_dev_password_change_me}
    volumes:
      - tsdb_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-smoker} -d $${POSTGRES_DB:-smoker}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  central:
    build:
      context: .
      dockerfile: deploy/docker/central.Dockerfile
    container_name: smoker-central
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-smoker}:${POSTGRES_PASSWORD:-smoker_dev_password_change_me}@db:5432/${POSTGRES_DB:-smoker}?sslmode=disable
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-smoker_admin_change_me}
      JWT_SECRET: ${JWT_SECRET:-smoker_dev_jwt_secret_please_change_in_production_32chars}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-smoker_dev_aes_gcm_encryption_key_32bytes!}
      LOCAL_PROBE_AUTO_ENROLL: ${LOCAL_PROBE_AUTO_ENROLL:-true}
      LOCAL_PROBE_NAME: ${LOCAL_PROBE_NAME:-Local Central Probe}
      LOCAL_PROBE_LOCATION: ${LOCAL_PROBE_LOCATION:-Central Host}
      LOCAL_PROBE_TOKEN: ${LOCAL_PROBE_TOKEN:-smk_local_dev_probe_token_change_in_production}
      SEED_PUBLIC_MONITORS: ${SEED_PUBLIC_MONITORS:-true}
      NOC_TV_ALLOW_UNAUTH: ${NOC_TV_ALLOW_UNAUTH:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    container_name: smoker-web
    restart: unless-stopped
    depends_on:
      central:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_APP_NAME: Smoker

  gateway:
    image: nginx:alpine
    container_name: smoker-gateway
    restart: unless-stopped
    depends_on:
      central:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${GATEWAY_BIND_ADDR:-0.0.0.0}:${APP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: smoker-cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

  caddy:
    image: caddy:2-alpine
    container_name: smoker-caddy
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  probe-local:
    build:
      context: .
      dockerfile: deploy/docker/probe.Dockerfile
    container_name: smoker-probe-local
    restart: unless-stopped
    network_mode: host
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      gateway:
        condition: service_healthy
    cap_add:
      - NET_RAW
    environment:
      CENTRAL_URL: ws://127.0.0.1:${APP_PORT:-8080}/ws/probe
      PROBE_TOKEN: ${LOCAL_PROBE_TOKEN:-smk_local_dev_probe_token_change_in_production}
      DATA_DIR: /data
      MAX_BUFFER_MB: "1024"
      MAX_BUFFER_HOURS: "168"
    volumes:
      - probe_local_data:/data

volumes:
  tsdb_data:
  probe_local_data:
  caddy_data:
  caddy_config:
